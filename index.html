    if(sleepOpt==='< 1.0 hr') adjustment+=2.5;

    if(rhr==='66+ bpm') adjustment+=2.0;

    if(vo2==='Excellent') adjustment-=0.6;
    if(vo2==='Elite (>50 ml/kg/min)') adjustment-=2.4;
    if(glucose==='Optimized (<85 mg/dL)') adjustment-=1.8;
    if(glucose==='Borderline') adjustment+=1.1;
    if(glucose==='Elevated') adjustment+=3.2;

            </div>
            <div className="hidden xl:flex items-center gap-8">
              {[

                {label:'EPIGENETIC ENGINE', ref:engineRef},

              ))}
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className="hidden md:flex items-center gap-1 bg-celadon-mist rounded-full p-1 border border-linen-hairline">

              <span className="flex items-center gap-2"><span className="w-px h-4 bg-linen-hairline"></span>SWISSMEDIC NO. 2024-MD-0482</span>

                {admissionStep===3 && (
                  <div className="space-y-6"><div className="font-mono text-[11px] tracking-[0.14em] uppercase">Step 3 — Primary Clinic & Allocation</div><div><label className="font-mono text-[10px] uppercase text-slate-celadon">Primary Clinic Location</label><div className="mt-3 grid grid-cols-1 gap-2">{['Zurich Enge','London Mayfair','Private At-Home Courier'].map((loc)=>(
                    <button key={loc} onClick={()=>setFormData({...formData,location:loc})} className={`text-left px-4 py-3 border font-mono text-[12px] flex justify-between ${formData.location===loc?'bg-pine-obsidian text-[#F8FAF8] border-pine-obsidian':'border-linen-hairline'}`}><span>{loc}</span><span className="opacity-60">{loc==='Zurich Enge'?'GOTTHARDSTRASSE 26':loc==='London Mayfair'?'QUEEN ANNE STREET':'72-HR GLOBAL COURIER'}</span></button>
                  ))}</div></div><div><label className="font-mono text-[10px] uppercase text-slate-celadon">Requested Tier Allocation</label><div className="mt-3 grid grid-cols-1 gap-2">{TIERS.map((t)=>(
                    <button key={t.id} onClick={()=>setSelectedTier(t.id)} className={`text-left px-4 py-3 border font-mono text-[12px] flex justify-between ${selectedTier===t.id?'bg-celadon-mist border-pine-obsidian':'border-linen-hairline'}`}><span>{t.name}</span><span>{formatPrice(t.basePrice)} / yr</span></button>
                  ))}</div></div><div className="flex justify-between pt-6"><button onClick={()=>setAdmissionStep(2)} className="font-mono text-[11px] tracking-[0.18em] px-6 py-3 border border-linen-hairline">BACK</button><button onClick={handleAdmissionSubmit} className="bg-pine-obsidian text-[#F8FAF8] font-mono text-[11px] tracking-[0.18em] px-8 py-3">TRANSMIT CLINICAL DOSSIER</button></div></div>
                )}
              </div>
            </>
          ) : (
            <div className="p-10 lg:p-14 text-center"><div className="w-12 h-12 rounded-full bg-medical-emerald/10 border border-medical-emerald/20 flex items-center justify-center mx-auto"><span className="text-medical-emerald text-[20px]">✓</span></div><div className="font-mono text-[10px] tracking-[0.22em] uppercase text-medical-emerald mt-6">Clinical Intake Confirmed</div><h3 className="font-serif text-[28px] leading-[1.1] mt-4">Clinical Dossier #{dossierId} received.</h3><p className="font-serif text-[15px] leading-[1.6] text-slate-celadon mt-4 max-w-[460px] mx-auto">Assigned to Chief Medical Officer, Zurich Private Clinic. Expedited phlebotomy courier kit dispatched to {formData.jurisdiction||'primary residence'}. A clinical registrar will coordinate your confidential intake consultation within 24 hours.</p><div className="mt-8 bg-celadon-mist border border-linen-hairline p-4 text-left max-w-[460px] mx-auto"><div className="font-mono text-[10px] uppercase text-slate-celadon">Dossier Details</div><div className="mt-2 space-y-1 font-mono text-[11px]"><div className="flex justify-between"><span className="text-slate-celadon">Patient</span><span>{formData.fullName||'Confidential'}</span></div><div className="flex justify-between"><span className="text-slate-celadon">Tier</span><span>{TIERS.find(t=>t.id===selectedTier)?.name}</span></div><div className="flex justify-between"><span className="text-slate-celadon">Location</span><span>{formData.location}</span></div><div className="flex justify-between"><span className="text-slate-celadon">Accession</span><span>{accessionCode}</span></div></div></div><button onClick={()=>setShowAdmission(false)} className="mt-8 bg-pine-obsidian text-[#F8FAF8] font-mono text-[11px] tracking-[0.18em] px-8 py-3">RETURN TO CLINICAL OVERVIEW</button></div>
          )}
        </div></div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
